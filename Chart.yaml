apiVersion: v2
name: observability-stack
description: A Helm chart to deploy Grafana, Tempo, Alloy, and Loki together
version: 1.0.0
appVersion: "1.0"



dependencies:
  - name:        grafana
    version:     " 8.5.5"  
    repository:  "https://grafana.github.io/helm-charts"
    condition:   grafana.enabled

  - name:        tempo
    version:     "1.10.3" 
    repository:  "https://grafana.github.io/helm-charts"
    condition:   tempo.enabled

  - name:        loki-distributed
    version:     "0.79.4" 
    repository:  "https://grafana.github.io/helm-charts"
    condition:   loki-distributed.enabled

  - name:        alloy
    version:     "0.9.1"  
    repository:  "https://grafana.github.io/helm-charts"
    condition:   alloy.enabled

  - name:        prometheus
    version:     "25.27.0"
    repository:  "https://prometheus-community.github.io/helm-charts"
    condition:   prometheus.enabled
  
  - name:        fluent-bit
    version:     "0.47.10"
    repository:  "https://fluent.github.io/helm-charts"
    condition:   fluentbit.enabled

  - name:        alertmanager
    version:     "1.13.0"
    repository:  "https://prometheus-community.github.io/helm-charts"
    condition:   alertmanager.enabled
  
  -  name:       prometheus-msteams
     version:    "1.3.4"
     repository:  https://prometheus-msteams.github.io/prometheus-msteams
     condition:   prometheus-msteams.enabled
  
  - name:        kubescape-operator
    version:     "1.23.4"
    repository:  https://kubescape.github.io/helm-charts/
    condition:   kubescape-operator.enabled